<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Central dividing line -->
  <line x1="590" y1="15" x2="590" y2="985" stroke="#540004" stroke-width="12" stroke-linecap="square" />
  
  <!-- Left Side: Elegant Serif Letter "M" -->
  <g fill="#540004">
    <!-- Left vertical stem & serifs -->
    <polygon points="20,335 150,335 150,355 95,355 95,745 150,745 150,765 20,765 20,745 75,745 75,355 20,355" />
    
    <!-- Left diagonal -->
    <polygon points="75,355 95,355 275,765 230,765" />
    
    <!-- Right diagonal & right thick stem with serifs -->
    <polygon points="230,765 275,765 440,355 495,355 495,335 365,335 365,355 420,355 420,745 495,745 495,765 365,765 365,745 440,745 440,370 275,765 235,765" />
    
    <!-- Fine-tuned Didone / Bodoni M character fallback via text for ultimate clarity -->
    <text x="60" y="760" font-family="'Didot', 'Playfair Display', 'Bodoni MT', 'Cinzel', 'Times New Roman', serif" font-size="580" font-weight="700" fill="#540004">M</text>
  </g>

  <!-- Right Side: Camera Line Art -->
  <g stroke="#540004" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top pentaprism / viewfinder slope -->
    <path d="M 590 190 L 740 190 L 810 335" />
    
    <!-- Top right shutter button / dial -->
    <path d="M 840 295 L 960 295 L 960 335 L 840 335 Z" fill="none" />
    
    <!-- Camera right body contour -->
    <path d="M 590 335 L 995 335 L 995 790 L 590 790" />
    <path d="M 840 445 L 995 445" />
    <path d="M 840 675 L 995 675" />
    <path d="M 840 335 L 840 790" />

    <!-- Lens outer ring -->
    <path d="M 590 335 A 260 260 0 0 1 590 855" stroke-width="18" />
    
    <!-- Lens inner bezel -->
    <path d="M 590 380 A 215 215 0 0 1 590 810" stroke-width="14" />
    
    <!-- Lens inner glass reflection accent arcs -->
    <path d="M 655 725 A 155 155 0 0 0 765 595" stroke-width="10" stroke-dasharray="16 16" />
    <path d="M 750 610 A 130 130 0 0 0 760 575" stroke-width="10" />
  </g>
</svg>
